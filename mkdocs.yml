# MkDocs 配置文件
# 為 LLM-agent-Demo 專案生成文檔站點

# 專案信息
site_name: LLM Agent Demo
site_description: 完整的 LLM Agent 框架學習資源庫，涵蓋 LangChain、LlamaIndex、AutoGen、CrewAI、MetaGPT 等主流框架
site_author: markl-a
site_url: https://markl-a.github.io/LLM-agent-Demo

# 代碼倉庫
repo_name: markl-a/LLM-agent-Demo
repo_url: https://github.com/markl-a/LLM-agent-Demo
edit_uri: edit/main/docs/

# 版權信息
copyright: Copyright &copy; 2025 markl-a

# 主題配置
theme:
  name: material
  language: zh-TW
  palette:
    # 淺色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換到深色模式

    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換到淺色模式

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant      # 即時載入
    - navigation.tracking     # 追蹤錨點
    - navigation.tabs         # 頂部選項卡
    - navigation.sections     # 側邊欄分組
    - navigation.expand       # 展開導航
    - navigation.top          # 返回頂部按鈕
    - navigation.indexes      # 章節索引頁
    - toc.follow              # 目錄跟隨
    - toc.integrate           # 目錄整合到側邊欄
    - search.suggest          # 搜索建議
    - search.highlight        # 搜索高亮
    - search.share            # 搜索分享
    - content.code.copy       # 代碼複製按鈕
    - content.code.annotate   # 代碼註釋
    - content.tabs.link       # 標籤頁連結

# Markdown 擴展
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# 插件
plugins:
  - search:
      lang:
        - zh
        - en
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
  - minify:
      minify_html: true
  # API 文檔自動生成
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            docstring_style: google
            docstring_section_style: table
            members_order: source
            show_signature_annotations: true
            separate_signature: true

# 額外配置
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/markl-a
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://www.python.org
      name: Python
  generator: false

# CSS 樣式
extra_css:
  - stylesheets/extra.css

# JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

