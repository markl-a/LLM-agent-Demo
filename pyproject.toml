[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-demo"
version = "2.0.0"
description = "全面的 LLM Agent 框架學習與實踐專案，涵蓋 LangChain、LlamaIndex、AutoGen、CrewAI 等主流框架"
authors = [
    {name = "LLM Agent Demo Contributors"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm",
    "agent",
    "langchain",
    "llamaindex",
    "autogen",
    "crewai",
    "metagpt",
    "rag",
    "ai",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
llm-agent = "llm_agent_demo.cli:main"

[project.urls]
Homepage = "https://github.com/markl-a/LLM-agent-Demo"
Documentation = "https://github.com/markl-a/LLM-agent-Demo/blob/main/README.md"
Repository = "https://github.com/markl-a/LLM-agent-Demo"
Issues = "https://github.com/markl-a/LLM-agent-Demo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "black>=24.0",
    "ruff>=0.7",
    "flake8>=7.0",
    "mypy>=1.13",
    "isort>=5.13",
    "pre-commit>=4.0",
    "bandit>=1.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.6",
]
all = ["llm-agent-demo[dev,docs,test]"]

# ==================== Ruff 代碼格式化與檢查 ====================
# Ruff 是一個快速的 Python linter 和 formatter，可以取代 Black、isort、flake8 等工具

# ==================== Pytest 測試配置 ====================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=50",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "requires_api_key: Tests that require API keys",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==================== Coverage 覆蓋率配置 ====================
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/build/*",
    "*/dist/*",
    "*/.ipynb_checkpoints/*",
    "*/setup.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
]

[tool.coverage.html]
directory = "htmlcov"

# ==================== Mypy 類型檢查 ====================
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    "venv/",
    "env/",
    "build/",
    "dist/",
    ".ipynb_checkpoints/",
]

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "llama_index.*",
    "autogen.*",
    "crewai.*",
    "metagpt.*",
]
ignore_missing_imports = true

[tool.ruff]
# Ruff 配置 - 統一的 linter 和 formatter
line-length = 100
target-version = "py39"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".ipynb_checkpoints",
    "*.egg-info",
]

[tool.ruff.lint]
# 啟用的規則集
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "PL",    # pylint
    "RUF",   # ruff-specific rules
]

# 忽略的規則
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "W191",   # indentation contains tabs
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

# 每個文件的特定忽略規則
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402"]
"tests/**" = ["ARG", "S101", "PLR2004"]

# isort 配置（整合在 Ruff 中）
[tool.ruff.lint.isort]
known-first-party = ["llm_agent_demo"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Formatter 配置
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ==================== Bandit 安全檢查 ====================
[tool.bandit]
exclude_dirs = [
    "tests/",
    "venv/",
    "env/",
    ".venv/",
]
skips = ["B101", "B601"]
