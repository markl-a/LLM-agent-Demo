name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
        check-modified-files-only: 'yes'
      continue-on-error: true

  validate-notebooks:
    name: Validate Jupyter Notebooks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-notebooks-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-notebooks-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert nbformat

    - name: Validate notebook structure
      run: |
        python -c "
        import os
        import json
        from pathlib import Path

        notebooks = list(Path('.').rglob('*.ipynb'))
        print(f'Found {len(notebooks)} notebooks')

        for nb in notebooks:
            if '.ipynb_checkpoints' in str(nb):
                continue
            try:
                with open(nb, 'r', encoding='utf-8') as f:
                    data = json.load(f)
                    if 'cells' not in data:
                        print(f'ERROR: {nb} missing cells')
                        exit(1)
                print(f'✓ {nb}')
            except json.JSONDecodeError as e:
                print(f'ERROR: {nb} invalid JSON - {e}')
                exit(1)
        print('All notebooks are valid!')
        "

  build-mkdocs:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 完整歷史（用於 git-revision-date 插件）

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-mkdocs-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-mkdocs-

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install MkDocs and dependencies
      run: |
        pip install --upgrade pip
        pip install mkdocs-material
        pip install mkdocs-git-revision-date-localized-plugin
        pip install mkdocs-minify-plugin

    - name: Build MkDocs site
      run: |
        mkdocs build --strict

    - name: Upload site artifacts
      uses: actions/upload-artifact@v6
      with:
        name: mkdocs-site
        path: site/
        retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-mkdocs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download site artifacts
      uses: actions/download-artifact@v4
      with:
        name: mkdocs-site
        path: site/

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
