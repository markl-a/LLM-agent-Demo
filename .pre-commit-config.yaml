# Pre-commit hooks 配置
# 安裝: pip install pre-commit
# 啟用: pre-commit install
# 運行: pre-commit run --all-files

default_language_version:
  python: python3.11

repos:
  # 基礎檢查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: 移除尾隨空白
      - id: end-of-file-fixer
        name: 確保文件以換行符結尾
      - id: check-yaml
        name: 檢查 YAML 語法
        args: ['--unsafe']
      - id: check-json
        name: 檢查 JSON 語法
      - id: check-toml
        name: 檢查 TOML 語法
      - id: check-added-large-files
        name: 檢查大文件
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: 檢查合併衝突標記
      - id: check-case-conflict
        name: 檢查文件名大小寫衝突
      - id: detect-private-key
        name: 檢測私鑰
      - id: mixed-line-ending
        name: 檢查混合行結束符
        args: ['--fix=lf']
      - id: check-docstring-first
        name: 檢查 docstring 位置

  # Python 代碼格式化
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: Black 代碼格式化
        language_version: python3.11
        args: ['--line-length=100']

  # Import 排序
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort 導入排序
        args: ['--profile', 'black', '--line-length', '100']

  # Ruff Linting (快速的 Python linter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: Ruff Linting
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format
        name: Ruff 格式化

  # Flake8 代碼檢查
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: Flake8 代碼檢查
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions

  # Mypy 類型檢查
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: Mypy 類型檢查
        args: ['--config-file=mypy.ini']
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-toml
        pass_filenames: false

  # 安全檢查
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: Bandit 安全掃描
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # Markdown 格式化
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        name: Markdown 格式化
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables
        args: ['--wrap', '100']

  # Jupyter Notebook 檢查
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        name: Jupyter Notebook Black 格式化
      - id: nbqa-isort
        name: Jupyter Notebook isort 排序
      - id: nbqa-flake8
        name: Jupyter Notebook Flake8 檢查
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  # Jupyter Notebook 輸出清理
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        name: 清理 Jupyter Notebook 輸出

  # YAML 格式化
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.12.0
    hooks:
      - id: pretty-format-yaml
        name: YAML 格式化
        args: ['--autofix', '--indent', '2']

# 使用說明：
# 1. 安裝 pre-commit: pip install pre-commit
# 2. 安裝 git hooks: pre-commit install
# 3. (可選) 運行所有文件: pre-commit run --all-files
# 4. 之後每次 git commit 都會自動運行這些檢查
