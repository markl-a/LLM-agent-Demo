[pytest]
# Pytest 配置文件
# 更新日期: 2025-12-31

# 測試目錄
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py *_test.py

# Python 類匹配模式
python_classes = Test*

# Python 函數匹配模式
python_functions = test_*

# 最小 Python 版本要求
minversion = 7.0

# 命令行選項
addopts =
    # 詳細輸出
    -v
    # 顯示測試覆蓋率摘要
    --cov=src
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    # 顯示失敗的測試詳情
    --tb=short
    # 顯示最慢的 10 個測試
    --durations=10
    # 啟用嚴格的標記檢查
    --strict-markers
    # 顯示捕獲的輸出
    -s
    # 在第一次失敗時停止（可選，用於調試）
    # -x
    # 顯示本地變量（用於調試）
    # -l
    # 警告設置
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# 測試標記
markers =
    unit: 單元測試
    integration: 整合測試
    slow: 慢速測試（需要較長時間）
    requires_api_key: 需要真實 API Key 的測試
    requires_network: 需要網絡連接的測試
    skip_in_ci: 在 CI 環境中跳過的測試
    asyncio: 異步測試
    mock: 使用 mock 的測試

# 覆蓋率配置
[coverage:run]
source = src,.
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */env/*
    */.venv/*
    setup.py
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # 標準排除模式
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    # 調試代碼
    if settings.DEBUG
    # 類型檢查相關
    if TYPE_CHECKING
    if typing.TYPE_CHECKING

[coverage:html]
directory = htmlcov

# 控制台輸出選項
console_output_style = progress

# 日誌配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 異步測試配置
asyncio_mode = auto

# 過濾警告
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*imp module.*:DeprecationWarning
    ignore:.*distutils.*:DeprecationWarning

# 測試發現
norecursedirs = .git .tox dist build *.egg node_modules venv env .venv

# 緩存目錄
cache_dir = .pytest_cache

# 超時設置（如果使用 pytest-timeout）
# timeout = 300
# timeout_method = thread
